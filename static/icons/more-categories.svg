<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- 九宫格 -->
  <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="#FFB800" stroke-width="2" fill="none"/>
  <rect x="24" y="14" width="7" height="7" rx="1.5" stroke="#FFB800" stroke-width="2" fill="none"/>
  <rect x="14" y="24" width="7" height="7" rx="1.5" stroke="#FFB800" stroke-width="2" fill="none"/>
  <rect x="24" y="24" width="7" height="7" rx="1.5" stroke="#FFB800" stroke-width="2" fill="none"/>
  <!-- 右侧加号 -->
  <line x1="34" y1="17.5" x2="40" y2="17.5" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="14.5" x2="37" y2="20.5" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
  <!-- 下方加号 -->
  <line x1="17.5" y1="34" x2="17.5" y2="40" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
  <line x1="14.5" y1="37" x2="20.5" y2="37" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
  <!-- 右下加号 -->
  <line x1="27.5" y1="34" x2="27.5" y2="40" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
  <line x1="24.5" y1="37" x2="30.5" y2="37" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
</svg>
